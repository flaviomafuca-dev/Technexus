{% extends "base.html" %}
{% block title %}Marcas de Equipamentos{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-5 mb-4">
        <div class="card card-table p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-patch-check text-primary me-2"></i> Nova Marca</h5>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Nome da Marca *</label>
                    <input type="text" class="form-control" name="name" required placeholder="ex: Dell, HP, Lenovo, Cisco">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-plus-lg me-1"></i> Criar Marca
                </button>
            </form>
        </div>
    </div>

    <div class="col-md-7">
        <div class="card card-table p-3">
            <h5 class="fw-bold mb-3">Marcas Registadas</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Nº Produtos</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for b in brands %}
                        <tr>
                            <td class="fw-semibold">{{ b.name }}</td>
                            <td><span class="badge bg-light text-dark border">{{ b.products.count() }}</span></td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="2" class="text-center text-muted py-3">Nenhuma marca registada.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
