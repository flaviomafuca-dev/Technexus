{% extends "base.html" %}
{% block title %}Novo Serviço Técnico{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0 text-dark">Cadastrar Serviço Técnico</h4>
            <a href="{{ url_for('services.index') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Voltar
            </a>
        </div>

        <div class="card card-table p-4">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Designação do Serviço *</label>
                    <input type="text" class="form-control" name="name" required placeholder="ex: Formatação e Instalação de Sistema Operativo">
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Preço de Referência (MT) *</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="reference_price" required value="0.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Custo Estimado de Execução (MT)</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="estimated_cost" value="0.00">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Tempo Estimado (Horas)</label>
                    <input type="number" step="0.5" min="0.5" class="form-control" name="estimated_hours" value="2.0">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Descrição / Procedimento</label>
                    <textarea class="form-control" name="description" rows="2" placeholder="O que inclui este serviço técnico..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="{{ url_for('services.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check2 me-1"></i> Registar Serviço
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
