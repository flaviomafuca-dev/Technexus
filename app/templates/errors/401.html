{% extends "base.html" %}
{% block title %}Não Autenticado (401){% endblock %}

{% block content %}
<div class="card card-table py-5 text-center my-4">
    <div class="card-body">
        <i class="bi bi-person-lock text-info display-1"></i>
        <h2 class="mt-3 fw-bold">Autenticação Necessária (401)</h2>
        <p class="text-muted">É necessário iniciar sessão no TechNexus para aceder a esta funcionalidade.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sessão
        </a>
    </div>
</div>
{% endblock %}
