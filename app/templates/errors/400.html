{% extends "base.html" %}
{% block title %}Pedido Inválido (400){% endblock %}

{% block content %}
<div class="card card-table py-5 text-center my-4">
    <div class="card-body">
        <i class="bi bi-shield-slash text-warning display-1"></i>
        <h2 class="mt-3 fw-bold">Pedido Inválido ou Sessão Expirada (400)</h2>
        <p class="text-muted">A requisição enviada é inválida ou o token de segurança (CSRF) expirou.</p>
        <div class="mt-3">
            <a href="javascript:history.back()" class="btn btn-outline-secondary me-2">
                <i class="bi bi-arrow-left me-1"></i> Voltar Atrás
            </a>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i> Ir para o Início
            </a>
        </div>
    </div>
</div>
{% endblock %}
