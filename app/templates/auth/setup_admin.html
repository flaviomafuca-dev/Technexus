<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração Inicial — TechNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #10223B 0%, #1B365D 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .setup-card {
            width: 100%;
            max-width: 500px;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 2.5rem 2rem;
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-2" style="width: 54px; height: 54px;">
                <i class="bi bi-shield-check fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Configuração do Administrador</h3>
            <p class="text-muted small">Crie a primeira conta de Administrador do sistema TechNexus.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.setup_first_admin') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label small fw-semibold">Nome Completo</label>
                <input type="text" class="form-control" name="full_name" required placeholder="ex: Arquiteto de Sistemas">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Nome de Utilizador (Username)</label>
                <input type="text" class="form-control" name="username" required placeholder="admin">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">E-mail Corporativo</label>
                <input type="email" class="form-control" name="email" required placeholder="admin@technexus.co.mz">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-semibold">Palavra-passe</label>
                    <input type="password" class="form-control" name="password" required placeholder="••••••••">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-semibold">Confirmar Palavra-passe</label>
                    <input type="password" class="form-control" name="confirm_password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                <i class="bi bi-check2-circle me-1"></i> Criar Administrador e Iniciar
            </button>
        </form>
    </div>
</body>
</html>
