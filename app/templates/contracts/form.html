{% extends "base.html" %}
{% block title %}Novo Contrato de Manutenção{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0 text-dark">Registar Contrato de Suporte</h4>
            <a href="{{ url_for('contracts.index') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Voltar
            </a>
        </div>

        <div class="card card-table p-4">
            <form method="POST" action="{{ url_for('contracts.create') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Cliente Contratante *</label>
                    <select name="customer_id" class="form-select" required>
                        <option value="">Selecione o cliente...</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Título do Contrato *</label>
                    <input type="text" class="form-control" name="title" required placeholder="ex: Manutenção Preventiva de Servidores e Rede Local">
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Valor Contratual (MT) *</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="value" required placeholder="0.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Periodicidade</label>
                        <select name="frequency" class="form-select">
                            <option value="monthly">Mensal</option>
                            <option value="quarterly">Trimestral</option>
                            <option value="annual">Anual</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Data de Início *</label>
                        <input type="date" class="form-control" name="start_date" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Data de Término / Renovação</label>
                        <input type="date" class="form-control" name="end_date">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Termos / Cláusulas do Contrato</label>
                    <textarea class="form-control" name="terms" rows="3" placeholder="SLA de atendimento, número de visitas mensais incluídas, horas de suporte..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="{{ url_for('contracts.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check2 me-1"></i> Registar Contrato
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
