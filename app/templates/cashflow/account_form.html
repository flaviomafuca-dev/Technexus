{% extends "base.html" %}
{% block title %}Nova Conta Financeira{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0 text-dark">Cadastrar Conta Financeira</h4>
            <a href="{{ url_for('cashflow.index') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Voltar
            </a>
        </div>

        <div class="card card-table p-4">
            <form method="POST" action="{{ url_for('cashflow.create_account') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Nome da Conta *</label>
                    <input type="text" class="form-control" name="name" required placeholder="ex: Millennium BIM Principal, M-Pesa Empresarial...">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Tipo de Conta *</label>
                    <select name="account_type" class="form-select" required>
                        <option value="bank">Conta Bancária</option>
                        <option value="cash">Caixa Físico em Dinheiro</option>
                        <option value="mpesa">M-Pesa (Carteira Móvel)</option>
                        <option value="emola">e-Mola (Carteira Móvel)</option>
                        <option value="pos">Conta TPA / POS</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Saldo Inicial de Abertura (MT) *</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="opening_balance" required value="0.00">
                    <small class="text-muted">Saldo que a conta já possui no momento de início no sistema</small>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Observações / Detalhes</label>
                    <textarea class="form-control" name="notes" rows="2" placeholder="Número de conta, agência, titularidade..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="{{ url_for('cashflow.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check2 me-1"></i> Criar Conta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
